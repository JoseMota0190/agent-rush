      <stop offset="0" stop-color="#132434"/>
      <stop offset=".65" stop-color="#080d16"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="metalStrategy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5269"/>
      <stop offset=".45" stop-color="#2b3c4e"/>
      <stop offset="1" stop-color="#1a2735"/>
