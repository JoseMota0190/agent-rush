<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bgAuditor" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#1a1733"/>
      <stop offset=".65" stop-color="#08080f"/>
      <stop offset="1" stop-color="#04040a"/>
    </radialGradient>
    <linearGradient id="metalAuditor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5269"/>
      <stop offset=".45" stop-color="#2b3c4e"/>
      <stop offset="1" stop-color="#1a2735"/>
    </linearGradient>
    <linearGradient id="visorAuditor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a970ff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#e2d0ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#a970ff" stop-opacity=".45"/>
    </linearGradient>
    <filter id="glowAuditor" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clipAuditor"><circle cx="128" cy="128" r="118"/></clipPath>
  </defs>

