<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGENT RUSH — REDIRECT</title>
<meta http-equiv="refresh" content="0; url=/?lang=en#modelos" />
<script>
  (function () {
    var query = new URLSearchParams(window.location.search).get("lang");
    var stored = null;
    try {
      stored = window.sessionStorage.getItem("agentrush.lang");
    } catch (_) { /* ignore */ }

    var lang = query === "en" || query === "es"
      ? query
      : (stored === "en" || stored === "es" ? stored : "en");

    window.location.replace("/?lang=" + lang + "#modelos");
  })();
</script>
<style>
  body {
    background: #05070d;
    color: #e6f1ff;
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .msg {
    text-align: center;
    padding: 2rem;
  }
  .msg h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  .msg p { color: #7fa7c9; }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid rgba(53, 214, 255, 0.3);
    border-radius: 50%;
    border-top-color: #35d6ff;
    animation: spin 1s linear infinite;
    margin-right: 10px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>Redirigiendo a la sección de modelos…<br />Redirecting to the models section…</p>
  </div>
</body>
</html>
